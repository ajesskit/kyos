name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Never run two publishes at once; a duplicate tag push waits rather than racing.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm >= 11.5.1, required for npm trusted publishing (OIDC).
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Guard: the pushed tag (vX.Y.Z) must match package.json version, so a
      # stale or hand-made tag can never publish the wrong code.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VERSION | tag: $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
      # Authenticates via npm trusted publishing (OIDC, id-token: write above);
      # no NPM_TOKEN secret is needed. Provenance is attached automatically.
      - run: npm publish --access public

  # Moves the `plugin-release` branch to the released commit. The Anthropic plugin
  # directory tracks that branch (plugin path: plugins/kyos), so only tagged releases
  # ever reach directory users; pushes to main never do. A branch is used instead of a
  # tag because the directory follows one fixed tag, which would need a portal edit on
  # every release. Only this job writes plugin-release, so --force is safe.
  promote-plugin:
    name: Promote plugin to directory branch
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify plugin is in sync with this release
        run: node scripts/build-plugin.js --check
      - name: Move plugin-release to the tagged commit
        run: git push origin "$GITHUB_SHA:refs/heads/plugin-release" --force
